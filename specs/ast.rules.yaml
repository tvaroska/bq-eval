# Declarative Structural & Security AST Contract (ast-grep)
# Enforces layered Ports, Adapters and Contracts across bq_eval/{contract,engine,showcase,cli}/:
# 1. bq_eval/** never imports examples/, benchmarks/, dynamic imports, or LLM SDKs.
# 2. contract/ imports only stdlib, pydantic, and bq_eval.contract.
# 3. engine/ imports only stdlib, bq_eval.contract, and bq_eval.engine.
# 4. showcase/ never imports bq_eval.cli; showcase/{view,renderer}.py import zero engine calculations.
# 5. SQLAlchemy ORM, shell=True subprocesses, and unparameterized SQL execute() are banned.

id: library-never-imports-examples-or-dynamic
language: Python
severity: error
message: "Boundary violation: bq_eval/ must never import examples/, benchmarks/, or dynamic imports."
files:
  - "bq_eval/**/*.py"
metadata:
  test_path: "bq_eval/engine/probe.py"
  invalid_examples:
    - "import examples"
    - "from examples.run_showcase_demo import main"
    - "import benchmarks"
    - "from benchmarks import m2_live"
    - "__import__('bq_eval.cli')"
    - "importlib.import_module('bq_eval.cli')"
  valid_examples:
    - "from bq_eval.contract.otel import OTelGenAISpanRecord"
    - "import examples_helper"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*(examples|benchmarks)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(examples|benchmarks)(\\b|\\.)"
    - pattern: __import__($$$)
    - pattern: importlib.import_module($$$)
    - pattern: import_module($$$)
---
id: no-model-sdk-imports-in-package
language: Python
severity: error
message: "Rule 0 violation: bq_eval/ deterministic package must never import LLM client SDKs."
files:
  - "bq_eval/**/*.py"
metadata:
  test_path: "bq_eval/cli/probe.py"
  invalid_examples:
    - "from google.genai import Client"
    - "import vertexai.preview"
    - "import openai"
    - "from anthropic import Anthropic"
    - "import langchain"
    - "from llama_index import VectorStoreIndex"
  valid_examples:
    - "from bq_eval.engine.sql_eval import build_ai_generate_table_judge_sql"
    - "import json"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*(google\\.genai|vertexai|openai|anthropic|langchain|llama_index)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(google\\.genai|vertexai|openai|anthropic|langchain|llama_index)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+google\\s+import\\s+(.*[\\s,(])?genai\\b"
---
id: contract-imports-only-contract-and-pydantic
language: Python
severity: error
message: "Layer violation (contract/): bq_eval/contract/ may import only stdlib, pydantic, and bq_eval.contract."
files:
  - "bq_eval/contract/**/*.py"
metadata:
  test_path: "bq_eval/contract/probe.py"
  invalid_examples:
    - "from bq_eval.engine.calibration import rogan_gladen_calibrate"
    - "from bq_eval.showcase.pipeline import run_showcase_pipeline"
    - "from bq_eval.cli.app import main"
    - "from ..engine import finops"
    - "from .. import showcase"
  valid_examples:
    - "from pydantic import BaseModel, ConfigDict"
    - "from bq_eval.contract.otel import OTelGenAISpanRecord"
    - "from .types import NonNegFloat"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*bq_eval\\.(engine|showcase|cli)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(bq_eval\\.|\\.\\.\\s*)(engine|showcase|cli)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(bq_eval|\\.\\.)\\s+import\\s+(.*[\\s,(])?(engine|showcase|cli)\\b"
---
