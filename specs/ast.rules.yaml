id: renderer-imports-no-calculation
language: Python
severity: error
message: "Layer violation (showcase renderer): view/renderer modules may import only stdlib, pydantic, bq_eval.contract, and sibling renderer modules."
files:
  - "bq_eval/showcase/**/*.py"
ignores:
  - "bq_eval/showcase/__init__.py"
  - "bq_eval/showcase/loadgen.py"
  - "bq_eval/showcase/pipeline.py"
  - "bq_eval/showcase/seeds_banking.py"
  - "bq_eval/showcase/seeds_claims.py"
metadata:
  test_path: "bq_eval/showcase/renderer_probe.py"
  invalid_examples:
    - "from bq_eval.engine.finops import compute_pareto_frontier"
    - "from bq_eval.engine.calibration import compute_gwet_ac2"
    - "from bq_eval.showcase.pipeline import run_showcase_pipeline"
    - "from .pipeline import run_showcase_pipeline"
    - "from . import loadgen"
    - "from ..engine import sql_eval"
  valid_examples:
    - "from bq_eval.contract.results import ShowcaseRunArtifacts"
    - "from bq_eval.showcase.view import PageView"
    - "import html"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*bq_eval\\.(engine|cli|showcase\\.(loadgen|pipeline|seeds_banking|seeds_claims))(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+((bq_eval\\.|\\.\\.\\s*)(engine|cli)|(bq_eval\\.showcase\\.|\\.\\s*)(loadgen|pipeline|seeds_banking|seeds_claims))(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(bq_eval\\.showcase|\\.)\\s+import\\s+(.*[\\s,(])?(loadgen|pipeline|seeds_banking|seeds_claims)\\b"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(bq_eval|\\.\\.)\\s+import\\s+(.*[\\s,(])?(engine|cli)\\b"
---
id: no-sqlalchemy-orm
language: Python
severity: error
message: "Persistence violation: sqlalchemy.orm is banned; use SQLAlchemy 2.0 Core or parameterized SQL."
ignores:
  - "tests/**"
metadata:
  test_path: "bq_eval/engine/sql_probe.py"
  invalid_examples:
    - "from sqlalchemy.orm import relationship"
    - "import sqlalchemy.orm"
  valid_examples:
    - "import sqlite3"
rule:
  any:
    - kind: import_statement
      regex: "^import\\s+sqlalchemy\\.orm(\\b|\\.)"
    - kind: import_from_statement
      regex: "^from\\s+sqlalchemy\\.orm\\b"
    - kind: import_from_statement
      regex: "^from\\s+sqlalchemy\\s+import\\b.*\\borm\\b"
---
id: no-subprocess-shell-true
language: Python
severity: error
message: "Security violation: subprocess with shell=True or os.system() is forbidden."
ignores:
  - "tests/**"
metadata:
  test_path: "bq_eval/cli/proc_probe.py"
  invalid_examples:
    - "subprocess.run(cmd, shell=True)"
    - "subprocess.Popen(cmd, shell=True, text=True)"
    - "os.system(cmd)"
  valid_examples:
    - 'subprocess.run(["bq", "version"], check=True)'
rule:
  any:
    - pattern: subprocess.$FN($$$, shell=True)
    - pattern: subprocess.$FN($$$, shell=True, $$$)
    - pattern: subprocess.$FN(shell=True)
    - pattern: subprocess.$FN(shell=True, $$$)
    - pattern: os.system($$$)
---
id: no-dynamic-sql-execute
language: Python
severity: error
message: "Security violation: dynamic f-string or concatenated SQL passed to .execute(); use parameterized queries."
ignores:
  - "tests/**"
metadata:
  test_path: "bq_eval/engine/query_probe.py"
  invalid_examples:
    - 'conn.execute(f"SELECT * FROM spans WHERE trace_id = {tid}")'
    - 'conn.execute("SELECT * FROM spans WHERE trace_id = " + tid, params)'
  valid_examples:
    - 'conn.execute("SELECT * FROM spans WHERE trace_id = ?", (tid,))'
constraints:
  QUERY:
    any:
      - kind: binary_operator
      - has:
          kind: interpolation
      - has:
          kind: binary_operator
rule:
  any:
    - pattern: $DB.execute($QUERY)
    - pattern: $DB.execute($QUERY, $$$)
