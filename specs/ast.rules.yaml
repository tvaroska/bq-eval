# Declarative Structural & Security AST Contract (ast-grep)
# Enforces package and layer boundaries across bq_eval/{core,finops,deploy,demo,cli}/:
# 1. bq_eval/** never imports examples/, benchmarks/, dynamic imports, or LLM SDKs.
# 2. Packages: core imports no other package; finops and deploy build on core; demo builds on
#    core and finops; only cli may import everything.
# 3. Layers: */contract/ imports only pydantic and contracts; */engine/ never imports pydantic,
#    demo or cli; demo/render/ imports no calculation modules.
# 4. SQLAlchemy ORM, shell=True subprocesses, and unparameterized SQL execute() are banned.
# tests/test_isolation_guard.py enforces the same rules in Python.

id: library-never-imports-examples-or-dynamic
language: Python
severity: error
message: "Boundary violation: bq_eval/ must never import examples/, benchmarks/, or dynamic imports."
files:
  - "bq_eval/**/*.py"
metadata:
  test_path: "bq_eval/core/engine/probe.py"
  invalid_examples:
    - "import examples"
    - "from examples.run_showcase_demo import main"
    - "import benchmarks"
    - "from benchmarks import m2_live"
    - "__import__('bq_eval.cli')"
    - "importlib.import_module('bq_eval.cli')"
  valid_examples:
    - "from bq_eval.core.contract.otel import OTelGenAISpanRecord"
    - "import examples_helper"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*(examples|benchmarks)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(examples|benchmarks)(\\b|\\.)"
    - pattern: __import__($$$)
    - pattern: importlib.import_module($$$)
    - pattern: import_module($$$)
---
id: no-model-sdk-imports-in-package
language: Python
severity: error
message: "Rule 0 violation: bq_eval/ deterministic package must never import LLM client SDKs."
files:
  - "bq_eval/**/*.py"
metadata:
  test_path: "bq_eval/cli/probe.py"
  invalid_examples:
    - "from google.genai import Client"
    - "import vertexai.preview"
    - "import openai"
    - "from anthropic import Anthropic"
    - "import langchain"
    - "from llama_index import VectorStoreIndex"
  valid_examples:
    - "from bq_eval.core.engine.sql_eval import build_ai_generate_table_judge_sql"
    - "import json"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*(google\\.genai|vertexai|openai|anthropic|langchain|llama_index)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(google\\.genai|vertexai|openai|anthropic|langchain|llama_index)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+google\\s+import\\s+(.*[\\s,(])?genai\\b"
---
