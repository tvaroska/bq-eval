id: no-sqlalchemy-orm
language: Python
severity: error
message: "Persistence violation: sqlalchemy.orm is banned; use SQLAlchemy 2.0 Core or parameterized SQL."
files:
  - "**/bq_eval/**/*.py"
ignores:
  - "**/tests/**"
metadata:
  test_path: "bq_eval/core/engine/sql_probe.py"
  invalid_examples:
    - "from sqlalchemy.orm import relationship"
    - "import sqlalchemy.orm"
  valid_examples:
    - "import sqlite3"
rule:
  any:
    - kind: import_statement
      regex: "^import\\s+sqlalchemy\\.orm(\\b|\\.)"
    - kind: import_from_statement
      regex: "^from\\s+sqlalchemy\\.orm\\b"
    - kind: import_from_statement
      regex: "^from\\s+sqlalchemy\\s+import\\b.*\\borm\\b"
---
id: no-subprocess-shell-true
language: Python
severity: error
message: "Security violation: subprocess with shell=True or os.system() is forbidden."
files:
  - "**/bq_eval/**/*.py"
ignores:
  - "**/tests/**"
metadata:
  test_path: "bq_eval/cli/proc_probe.py"
  invalid_examples:
    - "subprocess.run(cmd, shell=True)"
    - "subprocess.Popen(cmd, shell=True, text=True)"
    - "os.system(cmd)"
  valid_examples:
    - 'subprocess.run(["bq", "version"], check=True)'
rule:
  any:
    - pattern: subprocess.$FN($$$, shell=True)
    - pattern: subprocess.$FN($$$, shell=True, $$$)
    - pattern: subprocess.$FN(shell=True)
    - pattern: subprocess.$FN(shell=True, $$$)
    - pattern: os.system($$$)
---
id: no-subprocess-or-urllib-in-pure-packages
language: Python
severity: error
message: "Isolation violation (A-21): pure packages (core/, finops/, runner/) must never import or invoke subprocess or urllib."
files:
  - "**/bq_eval/core/**/*.py"
  - "**/bq_eval/finops/**/*.py"
  - "**/bq_eval/runner/**/*.py"
metadata:
  test_path: "bq_eval/core/engine/proc_probe.py"
  invalid_examples:
    - 'subprocess.run(["bq", "version"], check=True)'
    - "import subprocess"
    - "import subprocess as sp"
    - "from subprocess import run"
    - "import urllib.request as req"
    - "from urllib import request as r"
  valid_examples:
    - "import json"
    - "import sqlite3"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*(subprocess|urllib)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(subprocess|urllib)(\\b|\\.)"
    - pattern: subprocess.$FN($$$)
---
id: no-dynamic-sql-execute
language: Python
severity: error
message: "Security violation (A-21): dynamic f-string, concatenated, or .format() SQL passed to .execute/.executemany/.executescript; use parameterized queries."
files:
  - "**/bq_eval/**/*.py"
ignores:
  - "**/tests/**"
metadata:
  test_path: "bq_eval/core/engine/query_probe.py"
  invalid_examples:
    - 'conn.execute(f"SELECT * FROM spans WHERE trace_id = {tid}")'
    - 'conn.execute("SELECT * FROM spans WHERE trace_id = " + tid, params)'
    - 'conn.execute("SELECT * FROM spans WHERE trace_id = {}".format(tid))'
    - 'conn.execute("SELECT * FROM spans WHERE trace_id = %s" % tid)'
    - 'conn.executemany(f"INSERT INTO {table} VALUES (?)", rows)'
    - 'conn.executemany("INSERT INTO " + table + " VALUES (?)", rows)'
    - 'conn.executescript(f"DELETE FROM {table};")'
    - 'conn.executescript("DELETE FROM {}".format(table))'
  valid_examples:
    - 'conn.execute("SELECT * FROM spans WHERE trace_id = ?", (tid,))'
    - 'conn.executemany("INSERT INTO spans VALUES (?)", rows)'
    - 'conn.executescript(SQLITE_VIEWS_DDL)'
constraints:
  QUERY:
    any:
      - kind: binary_operator
      - pattern: $FMT.format($$$)
      - has:
          kind: interpolation
      - has:
          kind: binary_operator
      - has:
          pattern: $FMT.format($$$)
rule:
  any:
    - pattern: $DB.execute($QUERY)
    - pattern: $DB.execute($QUERY, $$$)
    - pattern: $DB.executemany($QUERY)
    - pattern: $DB.executemany($QUERY, $$$)
    - pattern: $DB.executescript($QUERY)
---
id: no-variable-sql-execute
language: Python
severity: error
message: "Security violation (A-21): non-literal variable SQL passed to .execute/.executemany/.executescript outside bq_eval/runner/; use literal parameterized SQL or UPPER_CASE DDL constants."
files:
  - "**/bq_eval/core/**/*.py"
  - "**/bq_eval/finops/**/*.py"
  - "**/bq_eval/deploy/**/*.py"
  - "**/bq_eval/demo/**/*.py"
  - "**/bq_eval/cli/**/*.py"
ignores:
  - "**/tests/**"
metadata:
  test_path: "bq_eval/core/engine/query_var_probe.py"
  invalid_examples:
    - 'q = f"SELECT * FROM spans WHERE trace_id = {tid}"\nconn.execute(q)'
    - 'q = "SELECT * FROM spans WHERE trace_id = {}".format(tid)\nconn.execute(q)'
    - "conn.execute(dynamic_sql)"
    - "conn.executemany(insert_sql, rows)"
    - "conn.executescript(script_sql)"
  valid_examples:
    - 'conn.execute("SELECT * FROM spans WHERE trace_id = ?", (tid,))'
    - 'conn.execute("SELECT * FROM spans " "WHERE trace_id = ?", (tid,))'
    - 'conn.executescript(SQLITE_VIEWS_DDL)'
constraints:
  QUERY:
    not:
      any:
        - kind: string
          not:
            has:
              kind: interpolation
        - kind: concatenated_string
          not:
            has:
              kind: interpolation
        - kind: identifier
          regex: "^[A-Z][A-Z0-9_]*$"
rule:
  any:
    - pattern: $DB.execute($QUERY)
    - pattern: $DB.execute($QUERY, $$$)
    - pattern: $DB.executemany($QUERY)
    - pattern: $DB.executemany($QUERY, $$$)
    - pattern: $DB.executescript($QUERY)
