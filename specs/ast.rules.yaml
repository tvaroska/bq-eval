# Declarative Structural & Security AST Contract (ast-grep)
# Run from the repository root (`ast-grep scan --rule specs/ast.rules.yaml`); globs use `**/bq_eval/...`
# so both repo-relative and absolute paths match consistently across `bq_eval/{core,finops,deploy,runner,demo,cli}/`:
# 1. bq_eval/** never imports examples/, benchmarks/, importlib/dynamic imports, 4-dot relative escapes, or LLM SDKs.
# 2. Packages: core imports no other package; finops, deploy, and runner build on core; demo builds on
#    core, finops, and runner; only cli may import everything.
# 3. Layers: */contract/ imports only pydantic and contracts; */engine/ never imports pydantic,
#    demo or cli; demo/render/ imports no calculation modules.
# 4. Pure packages (core, finops, runner) never import/call subprocess (list or shell) or urllib;
#    SQLAlchemy ORM, shell=True subprocesses, dynamic/formatted SQL, and variable-passed SQL execute() are banned.
# tests/test_isolation_guard.py enforces the same rules in Python.

id: library-never-imports-examples-or-dynamic
language: Python
severity: error
message: "Boundary violation: bq_eval/ must never import examples/, benchmarks/, importlib/dynamic imports, or 4-dot relative escapes."
files:
  - "**/bq_eval/**/*.py"
metadata:
  test_path: "bq_eval/core/engine/probe.py"
  invalid_examples:
    - "import examples"
    - "from examples.run_showcase_demo import main"
    - "import benchmarks"
    - "from benchmarks import m2_live"
    - "__import__('bq_eval.cli')"
    - "importlib.import_module('bq_eval.cli')"
    - "import importlib as il"
    - "from importlib import import_module as im"
    - "from .... import anything"
    - "from ....demo import loadgen"
  valid_examples:
    - "from bq_eval.core.contract.otel import OTelGenAISpanRecord"
    - "import examples_helper"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*(examples|benchmarks|importlib)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(examples|benchmarks|importlib)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+\\.{4,}"
    - pattern: __import__($$$)
    - pattern: importlib.import_module($$$)
    - pattern: import_module($$$)
---
