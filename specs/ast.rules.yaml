id: contract-layer-imports-only-contracts
language: Python
severity: error
message: "Layer violation (contract/): contract modules may import only stdlib, pydantic, and other contract modules."
files:
  - "**/bq_eval/*/contract/**/*.py"
metadata:
  test_path: "bq_eval/core/contract/probe.py"
  invalid_examples:
    - "from bq_eval.core.engine.calibration import rogan_gladen_calibrate"
    - "from bq_eval.demo.pipeline import run_showcase_pipeline"
    - "from bq_eval.cli.app import main"
    - "from ..engine import cost"
    - "from .. import engine"
    - "from bq_eval.core import engine"
    - "from bq_eval.runner.engine.loader import OfflineSqlRunner"
  valid_examples:
    - "from pydantic import BaseModel, ConfigDict"
    - "from bq_eval.core.contract.otel import OTelGenAISpanRecord"
    - "from .types import NonNegFloat"
rule:
  any:
    - kind: import_statement
      regex: "(?s)^import\\s+(.+,\\s*)*bq_eval\\.(\\w+\\.engine|demo\\.(pipeline|loadgen|golden_seeds|render)|cli)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+bq_eval\\.(\\w+\\.engine|demo\\.(pipeline|loadgen|golden_seeds|render)|cli)(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+\\.{2,}\\s*engine(\\b|\\.)"
    - kind: import_from_statement
      regex: "(?s)^from\\s+(\\.{2,}|bq_eval\\.\\w+)\\s+import\\s+(.*[\\s,(])?engine\\b"
