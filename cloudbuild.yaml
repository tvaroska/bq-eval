steps:
  - name: "ghcr.io/astral-sh/uv:python3.12-bookworm-slim"
    id: "lint-and-test"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        export PYTHONDONTWRITEBYTECODE=1
        uv lock --check --offline
        uv sync --frozen --extra dev
        uv pip install --python .venv/bin/python "ast-grep-cli>=0.35"
        .venv/bin/ast-grep scan --rule specs/ast.rules.yaml
        .venv/bin/ruff check --no-cache bq_eval tests examples
        .venv/bin/pytest -p no:cacheprovider -v
        .venv/bin/bq-eval demo --html-out /tmp/scorecard.html

options:
  logging: CLOUD_LOGGING_ONLY
