substitutions:
  _REGION: us-central1
  _AR_REPO: containers
  _IMAGE_NAME: bq-eval
  _PUSH: "false"

steps:
  - name: "ghcr.io/astral-sh/uv:0.12.24-python3.12-trixie-slim"
    id: "lint-and-test"
    entrypoint: "bash"
    env:
      - "BQ_EVAL_ONLINE_SYNC=1"
    args:
      - "scripts/gate.sh"

  - name: "hashicorp/terraform:1.9.8"
    id: "terraform-test"
    waitFor: ["-"]
    entrypoint: "sh"
    args:
      - "-c"
      - |
        set -eu
        terraform -chdir=terraform init -backend=false -input=false
        terraform -chdir=terraform validate
        terraform -chdir=terraform test

  - name: "gcr.io/cloud-builders/docker"
    id: "docker-build"
    waitFor: ["lint-and-test"]
    entrypoint: "bash"
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "-c"
      - |
        set -euo pipefail
        TAG="${SHORT_SHA}"
        if [[ -z "$${TAG}" ]]; then TAG="local"; fi
        IMAGE_REPO="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}"
        BUILD_TAG="$${IMAGE_REPO}:$${TAG}"
        docker build -t "$${BUILD_TAG}" -f Dockerfile .

  - name: "gcr.io/cloud-builders/docker"
    id: "container-healthz-smoke"
    waitFor: ["docker-build"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        TAG="${SHORT_SHA}"
        if [[ -z "$${TAG}" ]]; then TAG="local"; fi
        IMAGE_REPO="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}"
        BUILD_TAG="$${IMAGE_REPO}:$${TAG}"
        CID="$(docker run -d -p 127.0.0.1:18080:8080 "$${BUILD_TAG}")"
        trap 'docker rm -f "$${CID}" >/dev/null 2>&1 || true' EXIT
        for _ in $(seq 1 20); do
          if docker exec "$${CID}" /app/.venv/bin/python -c "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2); assert r.status == 200"; then
            exit 0
          fi
          sleep 1
        done
        docker logs "$${CID}" >&2
        exit 1

  - name: "gcr.io/cloud-builders/docker"
    id: "trivy-scan"
    waitFor: ["docker-build"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        TAG="${SHORT_SHA}"
        if [[ -z "$${TAG}" ]]; then TAG="local"; fi
        IMAGE_REPO="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}"
        BUILD_TAG="$${IMAGE_REPO}:$${TAG}"
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:0.58.2 image \
          --scanners vuln \
          --pkg-types os,library \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          "$${BUILD_TAG}"

  - name: "gcr.io/cloud-builders/docker"
    id: "docker-push"
    waitFor: ["container-healthz-smoke", "trivy-scan"]
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if [[ -n "${TAG_NAME}" || "${_PUSH}" == "true" ]]; then
          TAG="${SHORT_SHA}"
          if [[ -z "$${TAG}" ]]; then TAG="local"; fi
          IMAGE_REPO="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}"
          BUILD_TAG="$${IMAGE_REPO}:$${TAG}"
          docker tag "$${BUILD_TAG}" "$${IMAGE_REPO}:latest"
          docker push "$${BUILD_TAG}"
          docker push "$${IMAGE_REPO}:latest"
        fi

options:
  logging: CLOUD_LOGGING_ONLY
