[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bq-eval"
version = "0.2.0"
description = "BQ Eval & FinOps: dual-path BigQuery agent evaluation, calibrated SQL quality gates, and USD Cost per Verified Outcome."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7.0",
]

[project.scripts]
bq-eval = "bq_eval.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "sqlglot>=25.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["bq_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
